name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Fails the deploy on an absolute path, a missing file, a bare import or a
      # service worker entry that points at nothing, instead of shipping it.
      - name: Check the site works from a subfolder
        run: node scripts/check-pages.mjs

      - name: Stage static site
        run: |
          mkdir _site
          cp -R index.html favicon.svg og-image.png manifest.webmanifest sw.js robots.txt sitemap.xml .nojekyll css js data icons vendor _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
