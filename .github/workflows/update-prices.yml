name: Update hardware prices

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate current snapshot
        run: node scripts/sync-prices.mjs --check

      - name: Sync retailer feed
        env:
          PRICE_FEED_URL: ${{ secrets.PRICE_FEED_URL }}
          PRICE_FEED_TOKEN: ${{ secrets.PRICE_FEED_TOKEN }}
        run: node scripts/sync-prices.mjs

      - name: Commit updated prices
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Update hardware price snapshot"
          git push
